[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "futbol-beelup"
version = "0.2.0"
description = "Local football video archiving, highlight candidates and ball-following prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2024.10.22"]

[project.optional-dependencies]
gpu = ["ultralytics>=8.3,<9", "opencv-python>=4.10,<5"]
dev = ["build>=1.2"]

[project.scripts]
futbol = "futbol_beelup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
